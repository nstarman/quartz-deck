name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SC-005 (< 3 s edit-to-preview) is checked at 3 s locally; GitHub's 2-vCPU
  # runners render several decks in parallel, so allow more here (the test
  # prints the measured time either way).
  QD_PREVIEW_BUDGET_SECS: "10"
  QUARTO_VERSION: 1.11.9   # the version research.md and the checklists were verified against

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      # Python + plotly/jupyter so the Plotly export fixtures run (they skip
      # without them); the runner's preinstalled Google Chrome drives the
      # offline check and PDF (qd finds it on PATH).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for Plotly fixtures
        run: pip install plotly jupyter matplotlib

      # R for knitr decks (spec 013 US3): tests/engine.rs and run_knitr_from_slide
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R packages for knitr decks
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      # TeX for the Beamer export (spec 011); Typst comes with Quarto
      - name: TinyTeX
        run: quarto install tinytex --no-prompt
      - name: Browser
        run: google-chrome --version

      # per-deck environments (spec 004): tests/env.rs runs with both tools
      - uses: astral-sh/setup-uv@v6
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          run-install: false

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # the VS Code extension's logic (spec 006): node's own test runner, no npm packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extension tests
        run: node --test vscode/test/*.test.js

      - name: Tests (Quarto-backed tests run, not skip)
        run: |
          quarto --version
          cargo test

      - name: Slow checks (001 SC-004 100-slide perf, 002 SC-004 export timing, 003 SC-005 editing together)
        # `--ignored` alone would also run the opt-in probes (drift, external appender)
        run: cargo test --release -- --ignored --nocapture perf_100 export_30 fifty
