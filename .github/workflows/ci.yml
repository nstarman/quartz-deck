name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SC-005 (< 3 s edit-to-preview) is checked at 3 s locally; GitHub's 2-vCPU
  # runners render several decks in parallel, so allow more here (the test
  # prints the measured time either way).
  QD_PREVIEW_BUDGET_SECS: "10"
  QUARTO_VERSION: 1.11.9   # the version research.md and the checklists were verified against

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      # Python + plotly/jupyter so the Plotly export fixtures run (they skip
      # without them); the runner's preinstalled Google Chrome drives the
      # offline check and PDF (qd finds it on PATH).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for Plotly fixtures
        run: pip install plotly jupyter
      - name: Browser
        run: google-chrome --version

      # spec 004: per-deck environments (uv by default, pixi as the alternative)
      - name: uv and pixi
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (Quarto-backed tests run, not skip)
        run: |
          quarto --version
          cargo test

      - name: Slow checks (001 SC-004 100-slide perf, 002 SC-004 export timing, 003 SC-005 editing together)
        # `--ignored` alone would also run the opt-in probes (drift, external appender)
        run: cargo test --release -- --ignored --nocapture perf_100 export_30 fifty
