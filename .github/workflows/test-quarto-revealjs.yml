name: test quarto-revealjs

# End-to-end test of the quarto-revealjs skill (skills/quarto-revealjs) against the latest Quarto
# release, with qd built from this checkout: builds the fixture decks with the skill's assets and
# checks them offline, as PDF, and feature by feature against the guide. Weekly, so upstream
# changes (Quarto, its bundled reveal.js, plotly) show up here; GitHub emails a failed scheduled
# run. See skills/quarto-revealjs/UPDATING.md.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays
  pull_request:
    paths:
      - "skills/quarto-revealjs/**"
      - "tests/skills/quarto-revealjs/**"
      - ".github/workflows/test-quarto-revealjs.yml"
      - "src/**"
      - "Cargo.*"
  workflow_dispatch:
    inputs:
      quarto-version:
        description: "Quarto release tag to test (e.g. v1.12.0); empty = latest"
        required: false

permissions:
  contents: read

jobs:
  test:
    name: test quarto-revealjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Quarto (latest release unless one is given), ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.quarto-version }}
        run: |
          # $TAG unquoted on purpose: empty means the latest release.
          gh release download $TAG --repo quarto-dev/quarto-cli \
            --pattern 'quarto-*-linux-amd64.deb' --output quarto.deb
          sudo apt-get update -q && sudo apt-get install -y -q ./quarto.deb ffmpeg
          quarto --version
      - name: qd from this checkout
        run: cargo install --locked --path . && qd --version && qd browser --install --human
      - name: Python packages (latest, to catch upstream changes)
        run: |
          python -m pip install --quiet plotly jupyter playwright
          python -m playwright install --with-deps chromium webkit   # headless only
      - name: Test the skill
        run: tests/skills/quarto-revealjs/run.sh "$RUNNER_TEMP/deck"
      - name: Keep the rendered decks, PDF and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarto-revealjs-output
          path: |
            ${{ runner.temp }}/deck/out-*
            ${{ runner.temp }}/deck-scaffold/_output
