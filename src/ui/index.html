<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quartz-deck</title>
<link rel="stylesheet" href="/editor.css">
</head>
<body>
<!-- one top row: the name, the menus (menubar.js puts them after it), and on the right
     only what needs the person's attention: notices, problems, the last render's link -->
<header>
  <strong class="app">quartz-deck</strong>
  <span id="deck-name"><span class="title"></span> <small class="file"></small></span>
  <button type="button" id="slide-picker" aria-haspopup="menu" title="Go to a slide"></button>
  <span id="notice" role="status" aria-live="polite"></span>
  <span id="status" class="quiet">connecting…</span>
  <button type="button" id="export-menu" aria-haspopup="menu" title="Export the deck">Export ▾</button>
  <span class="split"><button type="button" id="present" title="Present from this slide">▶ Present</button><button type="button" id="present-more" aria-label="More ways to present" aria-haspopup="menu">▾</button></span>
  <a id="rendered" target="_blank" rel="noopener" hidden>Open ↗</a>
</header>
<div id="banner" role="alert" hidden><span class="msg"></span><button type="button" class="close" aria-label="Dismiss" title="Dismiss">×</button></div>
<div id="gooffer" role="status" hidden><span class="msg"></span> <button type="button" data-act="go">Go there</button> <button type="button" data-act="dismiss" aria-label="Dismiss">×</button></div>
<main>
  <nav aria-label="Slides">
    <ol id="slides"></ol>
    <button type="button" id="add-slide" class="wide" title="Add a slide at the end" aria-label="Add a slide at the end">+</button>
  </nav>
  <aside id="history" aria-label="History" hidden>
    <h2>History</h2>
    <p class="status" role="status"></p>
    <ol class="versions"></ol>
    <ol class="changes" aria-label="Changed slides"></ol>
    <pre class="diff" hidden></pre>
  </aside>
  <section id="srcpane" aria-label="Source" hidden>
    <div class="srcbar">
      <strong>Source</strong>
      <span class="hint">saves as you pause · ⌘S saves now</span>
      <span class="runbar">
        <button type="button" data-act="run-all" title="Run every cell from the top">▶ Run all</button>
        <button type="button" data-act="run-stop" title="Stop the running cell">■ Stop</button>
        <span class="kernel" role="status" aria-label="Python state" title="Python kernel">Python · stopped</span>
        <button type="button" data-act="more" aria-haspopup="menu" title="Restart Python, add packages, set up Python">···</button>
      </span>
      <button type="button" data-act="full" aria-pressed="false" title="Use the full width">Full width</button>
      <button type="button" data-act="form" title="Show the properties of the slide or element">Properties</button>
    </div>
    <div class="srcwrap">
      <pre aria-hidden="true"></pre>
      <div class="band" aria-hidden="true"></div>
      <textarea spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Deck source (.qmd)"></textarea>
      <div class="gutter" aria-label="Run cells"></div>
    </div>
    <div class="outdock" aria-label="Cell output" aria-live="polite" hidden></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the source pane" tabindex="0"></div>
  <section id="stage" aria-label="Preview">
    <div id="slidebar" role="toolbar" aria-label="Slide properties">
      <button type="button" data-act="bg" title="Background colour"><span class="chip"></span> Background</button>
      <button type="button" data-act="bg-image" title="Background image">Image…</button>
      <label class="inline">Transition <select name="transition" aria-label="Transition">
        <option value="">default</option><option>none</option><option>fade</option><option>slide</option>
        <option>convex</option><option>concave</option><option>zoom</option>
      </select></label>
      <label class="inline"><input type="checkbox" name="hidden" aria-label="Hidden in the presentation"> Hidden</label>
      <button type="button" data-act="more" aria-haspopup="menu" title="More slide actions (or right-click the slide)">⋯</button>
    </div>
    <div class="previews">
      <iframe id="preview" title="Slide preview"></iframe>
      <figure id="then" hidden><figcaption></figcaption><iframe title="The deck as it was"></iframe></figure>
    </div>
  </section>
  <aside id="panel" aria-label="Properties"></aside>
</main>

<template id="slide-panel">
  <h2>Slide <code class="ref"></code></h2>
  <form class="slide-form">
    <label>Title <input name="title" autocomplete="off"></label>
    <fieldset>
      <legend>Background</legend>
      <label class="row">Colour
        <input name="bgpick" type="color" aria-label="Pick background colour">
        <input name="bg" placeholder="none" autocomplete="off">
      </label>
      <label>Image <input name="bgimage" placeholder="path or URL" autocomplete="off"></label>
    </fieldset>
    <label>Transition
      <select name="transition">
        <option value="">default</option>
        <option>none</option><option>fade</option><option>slide</option>
        <option>convex</option><option>concave</option><option>zoom</option>
      </select>
    </label>
    <label>Classes <input name="classes" placeholder="e.g. smaller center" autocomplete="off"></label>
    <label>Content (markdown; positioned boxes are kept)
      <textarea name="body" rows="10" spellcheck="false"></textarea>
    </label>
    <div class="buttons">
      <button type="submit" class="primary">Apply</button>
      <button type="reset">Revert</button>
    </div>
  </form>
  <form class="add-box">
    <h3>Positioned boxes</h3>
    <div class="buttons"><button type="button" data-act="textbox">Add text box</button></div>
    <label>Image path or URL <input name="image" placeholder="figures/plot.png" autocomplete="off"></label>
    <div class="buttons"><button type="submit">Add image box</button></div>
  </form>
  <div class="buttons">
    <button type="button" data-act="up">Move up</button>
    <button type="button" data-act="down">Move down</button>
    <button type="button" data-act="dup">Duplicate</button>
    <button type="button" data-act="rm" class="danger">Delete</button>
  </div>
  <p class="hint">Click an element in the preview to edit it.</p>
</template>

<template id="title-panel">
  <h2>Title slide <code>front matter</code></h2>
  <form>
    <label>Deck title <input name="title" autocomplete="off"></label>
    <div class="buttons"><button type="submit" class="primary">Apply</button></div>
  </form>
  <p class="hint">Author, date and other options live in the YAML front matter (<code>qd meta</code>).</p>
</template>

<template id="export-panel">
  <h2>Export</h2>
  <p class="status"></p>
  <ul class="problems"></ul>
  <p class="links"></p>
  <div class="buttons"><button type="button" data-act="close">Back to slide</button></div>
  <p class="hint">Problems link to their slide. The first export downloads MathJax (and a browser if none is installed); later exports work offline.</p>
</template>

<template id="element-panel">
  <h2><span class="kind"></span> <code class="ref"></code></h2>
  <form class="geom-form" hidden>
    <fieldset>
      <legend>Position and size (px)</legend>
      <div class="grid">
        <label>Left <input name="left" type="number" step="1"></label>
        <label>Top <input name="top" type="number" step="1"></label>
        <label>Width <input name="width" type="number" step="1" min="1"></label>
        <label>Height <input name="height" type="number" step="1" min="1"></label>
      </div>
    </fieldset>
    <div class="buttons">
      <button type="submit" class="primary">Apply position</button>
      <button type="button" data-act="rmbox" class="danger">Delete box</button>
    </div>
    <p class="hint">Or drag the box in the preview; drag a handle to resize (Shift keeps the aspect ratio).</p>
  </form>
  <form class="element-form">
    <label>Source (markdown)
      <textarea name="md" rows="12" spellcheck="false"></textarea>
    </label>
    <div class="buttons">
      <button type="submit" class="primary">Apply</button>
      <button type="button" data-act="deselect">Back to slide</button>
    </div>
  </form>
  <p class="hint">Esc returns to the slide. Double-click an element to jump here.</p>
</template>

<script type="module" src="/editor.js"></script>
</body>
</html>
