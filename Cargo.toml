[package]
name = "quartz-deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local GUI + LLM-friendly CLI editor for Quarto reveal.js decks"
license-file = "LICENSE"
publish = false

[[bin]]
name = "qd"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"
